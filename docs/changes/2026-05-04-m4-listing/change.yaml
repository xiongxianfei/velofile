notes:
  - M4 implements non-UI listing and visibility foundations only; WinUI folder open entry points, breadcrumb, sidebar rendering, and view-mode controls remain assigned to M5.
  - Thumbnail and nonessential metadata enrichment remain assigned to preview/thumbnail milestones; M4 keeps the first viewport feed independent from those later adapters.
  - Protected operating-system-file first-use confirmation is UI behavior and remains assigned to later visibility UI work; M4 enforces the default hidden state and projection flags.
  - Review-resolution added direct slow-tab isolation proofs and split drive discovery from timeout-bounded free-space hint enrichment.
  - Second review-resolution pass added direct proof for cancellation-ignoring stale listing completion/failure and live underlying drive hint read caps.
