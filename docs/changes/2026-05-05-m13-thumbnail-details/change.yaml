notes:
  - Thumbnail execution is now modeled separately from content preview with per-item timeout, concurrency limiting, stale-generation cancellation, and generic icon fallback.
  - Review resolution changed thumbnail timeout enforcement from cooperative cancellation only to a visible-deadline race, so rows leave Loading at the thumbnail budget even when a provider ignores cancellation.
  - Timed-out provider work continues to hold a controller-wide live provider slot until the provider task actually completes, which preserves the thumbnail concurrency cap under hung providers across superseded generations.
  - Late provider success after a visible timeout is ignored for that request generation, preventing stale thumbnail flicker.
  - Thumbnail StateChanged handling is marshaled through an app-layer shell dispatcher before refreshing row view models or raising shell binding notifications; production launch passes a WinUI dispatcher into composition before the view model subscribes to thumbnail events.
  - The production Windows thumbnail provider asks Windows for file/folder thumbnails and falls back to cached generic icon artifacts by directory or extension class.
  - The file list binds row view models that combine visible listing rows with thumbnail state and hidden/protected visual dimming.
  - File-list row view models are stable and update thumbnail properties in place, so thumbnail completion does not replace row objects and risk clearing selection.
  - The preview/details surface exposes accessibility names for empty, loading, unsupported, and failed preview states and uses complete metadata fields for the details pane.
  - The preview corpus now supports `preview --scope thumbnails` and records thumbnail concurrency, timeout, generic-icon fallback, and stale-result behavior evidence.
  - Corpus tests use `powershell.exe` on Windows because launching `pwsh` from the redirected MSTest harness can leave the child host stuck after the copied corpus tool is published; the standalone `pwsh` corpus script remains validated directly.
  - The preview pane contract now expects DetailsMetadataFields because M13 deliberately routes the details pane through selected-item metadata rather than preview-only fallback metadata.
