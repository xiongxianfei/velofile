notes:
  - Benchmark reports remain non-gating for contributor runs while carrying measured median, p95, p99, environment, corpus, and release-threshold metadata.
  - Release compatibility aggregation covers operations, drag/drop, path compatibility, association contracts, and DPI contracts.
  - Diagnostics conformance writes local-only evidence and scans generated diagnostics artifacts for prohibited raw sensitive values.
