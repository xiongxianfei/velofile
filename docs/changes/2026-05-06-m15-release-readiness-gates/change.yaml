    result: passed 3 App accessibility contract tests
  - command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-benchmarks.ps1 -NonGating -ScratchRoot <scratch-root> -RunCount 2
    result: passed and wrote infrastructure-only benchmark evidence with releaseEvidence=false
  - command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-diagnostics-conformance.ps1 -ScratchRoot <scratch-root>
    result: passed and wrote diagnostics workflow plus triage-decision evidence
  - command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-compat-corpus.ps1 -Scope release -ScratchRoot <scratch-root>
    result: intentionally returned 1 and wrote status=incomplete because required release verifier evidence is missing
  - command: dotnet test tests\VeloFile.Corpus.Tests\VeloFile.Corpus.Tests.csproj -c Debug
    result: passed 13 Corpus tests
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci.ps1
    result: passed dotnet --info, restore, build with 0 warnings and 0 errors, and 330 tests across 4 test assemblies
notes:
  - Benchmark reports remain non-gating and infrastructure-only for contributor runs; current measurements do not satisfy P1-P13 or AC15 release evidence.
  - Release compatibility aggregation consumes scope result documents and reports fixture-only, skipped, or missing verifier evidence without upgrading it to verified.
  - Diagnostics conformance writes local-only workflow evidence for navigation, preview, file operations, search, terminal launch, and session restore plus explicit triage decisions.
  - Preview triage policy documents crash, hang, diagnostics, p95 regression blockers, the explicit exception path, and the required accessibility checklist.
