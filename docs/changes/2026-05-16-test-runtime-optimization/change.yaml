notes:
  - M1 is scoped to category taxonomy, baseline runtime evidence, local validation commands, and shared-state inventory.
  - Public wrapper execution model, prepared-tool harness, release-evidence split, and parallelization changes are deferred to later milestones.
  - code-review-r1 requested changes for TRO-CR1 before M1 can close.
  - TRO-CR1 was resolved by requiring non-empty ReleaseEvidenceFastRationale text for ReleaseEvidence + Fast tests.
  - code-review-r2 approved M1 and closed the milestone.
  - M2 adds in-process corpus contract checks through a test-only internal seam while preserving existing public wrapper tests until M3.
  - code-review-r3 approved M2 and closed the milestone.
  - M3 adds minimal public script smoke coverage for each public corpus script family and a named hermetic wrapper isolation test.
  - code-review-r4 approved M3 and closed the milestone.
  - M4 adds a test-internal prepared corpus tool harness with current-run manifest validation and no public script option changes.
  - code-review-r5 requested M4 changes for TRO-CR2; prepared-tool publish must not mutate repo bin/obj outputs and the repo-output oracle must prove setup plus invocation.
  - TRO-CR2 was resolved by preparing the Corpus tool from a scratch-owned source copy and expanding repo bin/obj output snapshots before setup.
  - code-review-r6 approved M4 and closed the milestone.
  - M5 preserves explicit ReleaseEvidence selection, broad CI closeout, and evidence-tier rationale checks for Visual/ManualEvidence tests included in fast/default filters.
  - code-review-r7 requested M5 changes for TRO-CR3; ManualEvidence fast-default rationale requires direct regression proof.
  - TRO-CR3 was resolved by adding direct ManualEvidence + Fast/Contract rationale rejection and acceptance tests.
  - code-review-r8 approved M5 and closed the milestone.
  - M6 adds runtime report contract tests and records optimized runtime evidence, top 10 slow tests, full CI status, target misses, and coverage preservation.
  - M6 records that Corpus fast/contract no-build and full CI remain above SHOULD-level targets without deleting wrapper, prepared-tool, or release-evidence coverage.
  - code-review-r9 approved M6 and closed the milestone with no findings.
