notes:
  - Copy and Cut stage file transfers in the app shell; Paste routes staged transfers through the operation service against the active target folder.
  - Copy and Move are explicit Core operation kinds with target-directory validation, visible running/completed/failed/cancelled/conflict states, and cancellation propagation through the adapter boundary.
  - Name collisions return a `WaitingForConflict` state with Skip, Replace, and Keep both choices. Conflict resolution resumes the original operation and refreshes the original paste target, not whichever folder is active later.
  - Windows copy/move mapping stays behind `VeloFile.Windows`; the adapter probes same-name collisions before execution and never performs hidden permanent-delete behavior.
  - Copy is never undo-eligible. Move, rename, and Recycle Bin delete remain undo-eligible only when the adapter reports support. Permanent delete remains non-undoable.
  - Batch Skip handling skips only colliding destinations and continues unaffected copy/move items.
  - The operations corpus profile now includes copy, move, collision, delete, rename, and partial-batch placeholders, and the operations compatibility runner validates those fixtures under a scratch root.
