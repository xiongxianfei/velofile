notes:
  - The preview controller owns request generation, previous-preview cancellation, delayed loading, timeout failure, terminal unsupported/failed/success states, and stale-result suppression.
  - M11 ships metadata-only fallback and state plumbing; rich image/text/PDF content providers remain assigned to M12.
  - The app composition root injects a metadata-only preview provider, a preview controller, redacted diagnostics, and a retained path-redaction salt.
  - Ctrl+P toggles the preview pane, single selection starts preview, non-single selection clears preview, and tab/listing/search changes clear stale preview state.
  - Preview failure diagnostics use controlled reason codes and redacted paths; raw file contents and raw paths are not diagnostic fields.
  - The preview corpus `contract` scope now invokes the preview controller behavior verifier before reporting verified evidence.
  - Review resolution adds provider-operation timeout policy for the R67 budgets and direct scratch-file non-mutation proof for preview controller/provider paths.
  - Metadata fallback now carries and exposes size, created/modified/accessed timestamps, attributes, and type when those values are available.
