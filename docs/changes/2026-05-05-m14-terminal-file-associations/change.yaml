notes:
  - Terminal discovery is lazy; the app shell constructor does not probe terminals during startup.
  - Default terminal ordering is Windows Terminal, PowerShell 7, Windows PowerShell, then Command Prompt; Git Bash and WSL distributions remain selectable when discovered.
  - Terminal launch uses structured process start data and working directories rather than concatenated shell command text.
  - Terminal launch diagnostics record the selected terminal identity and result state, but not the working directory or command text.
  - Open and Open With use a Windows ShellExecute boundary and always request association launches without modifying system associations.
