notes:
  - M6 adds the command and selection contracts without enumerating or hosting OS Shell extension menu entries.
  - WinUI uses `VirtualKey.Back` for the Backspace key; the command route remains the V1 Backspace parent-folder behavior.
  - Clipboard behavior is implemented through a Core writer interface and a Windows Unicode-text clipboard adapter. Tests do not mutate the real clipboard.
  - File operation verbs are routed as command ids/placeholders here; destructive behavior remains assigned to M8-M10.
  - Review resolution wires the visible WinUI context menu to Core command availability before opening and before command execution.
  - App-shell blocker resolution binds the production file list to real `ListedFileItem` values and routes file-command accelerators through WinUI focus context before invoking Core commands.
  - The stale drive-hint generation test now uses enough hint slots to test generation safety without contradicting the existing live-underlying-read concurrency cap.
  - Fourth-pass review resolution wires production folder listing into `AppShellViewModel.FileItems` and orders selected items by the current visible file-list order.
