notes:
  - M3 implements persistence and diagnostics foundations only; UI session restore and start-fresh flows remain assigned to M5.
  - Preview-release numeric promotion thresholds remain assigned to M15 release triage; M3 provides local marker and diagnostic primitives that threshold policy will consume.
  - Diagnostic output records path classification and non-reversible path fingerprints only; raw paths, filenames, usernames, clipboard content, search queries, and preview text are not serialized by default.
  - Durable writes use the Core repository abstraction and the Windows storage adapter for same-directory temp files, flush, atomic replacement where available, and last-known-good backup recovery.
  - Review resolution added recoverable storage read failures, codecs for all M3 local state documents, session window-placement round trip, best-effort diagnostics storage, deny-by-default diagnostic field policies, non-correlating denied-string redaction, and repository-level diagnostics for successful reads with per-field fallback.
