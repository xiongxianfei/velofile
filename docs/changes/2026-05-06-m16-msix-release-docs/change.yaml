notes:
  - Unsigned local packaging and signed release packaging are intentionally separate. Contributor runs produce an unsigned MSIX; release workflow runs signed packaging with a certificate thumbprint.
  - The package manifest avoids file associations, app execution aliases, and Explorer context menu extensions so VeloFile remains side by side with File Explorer.
  - V1 release/user docs explicitly document extension display, invoice.pdf.exe clarity, built-in context menu scope, stable update channel, rollback by uninstall, and Explorer/file-association non-ownership.
  - Review remediation keeps the signed Git tag release-source claim and enforces it with an isolated GPG keyring, configured release public keys, and a full-fingerprint release-key allowlist before packaging or GitHub Release creation.
  - Review remediation maps package architectures to matching .NET RIDs and adds dry-run proof for x86, x64, and ARM64 packaging.
  - Review remediation added release verification for change metadata path and Markdown-anchor drift.
  - Follow-up review remediation verifies release tags with an isolated GNUPGHOME and an explicit approved full-fingerprint release-key allowlist, so tags signed by unapproved available keys do not pass the release gate.
  - Full temp Git/GPG integration is intentionally deferred because the verifier trust decision is covered by deterministic git verify-tag --raw status fixtures; the workflow contract test separately proves production invokes the verifier before packaging with isolated GNUPGHOME and trusted key configuration.
