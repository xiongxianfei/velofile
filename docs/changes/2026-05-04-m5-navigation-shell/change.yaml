notes:
  - M5 implements core navigation/sidebar/session state, navigation command routing, app launch restore composition, and a compiled WinUI shell surface. It does not implement file selection, file commands, context-menu behavior, filtering/search, or preview behavior; those remain assigned to later milestones.
  - Session restore keeps missing paths visible through a missing-location tab state and close-tab action flag. Actual path existence, monitor availability, scroll-anchor existence, and repeated-crash detection are supplied through explicit interfaces.
  - Review resolution enforces an always-at-least-one-tab workspace invariant and wires app launch through durable session/settings/favorites/recent-location reads before creating the shell view model.
  - Visibility settings now have an application-level service that round-trips through settings persistence and requires confirmation before protected operating-system files are first shown.
  - App shell tests are file-based contract checks because the repository does not yet have a WinUI UI automation harness.
