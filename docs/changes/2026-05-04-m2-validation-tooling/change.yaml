  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-preview-corpus.ps1 -Root <scratch-root>
    result: passed
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-benchmarks.ps1 -NonGating -Root <scratch-root>
    result: passed
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci.ps1
    result: passed 9 tests across 4 test assemblies
notes:
  - M2 implements smoke corpus and non-gating benchmark shape only.
  - Non-smoke compat and preview scopes fail fast until their owning milestones implement them.
  - Scratch roots must be explicit, absolute, dedicated VeloFile corpus workspaces.
  - scripts/select-validation.py is not present; M2 used the plan-specified validation commands directly.
