notes:
  - Image preview supports common image extensions through a Windows BitmapDecoder/SoftwareBitmap decode path, returns PNG render artifacts, enforces the 100 MB input cap at metadata precheck and opened-stream decoder boundaries, and rejects decoded dimensions above 8192 by 8192 before content success.
  - Text/code preview reads at most the first 1 MB, reports truncation, rejects binary-looking inputs, and uses the 100 MB metadata-only cap.
  - PDF preview renders PDF pages through a Windows.Data.Pdf renderer, returns encoded page artifacts, initially renders page 1, exposes a paged preview hook and production shell Previous/Next controls for later-page navigation, and enforces the 500 MB cap at metadata precheck and opened-stream renderer boundaries.
  - Production app composition now uses Windows image, text, and PDF providers before metadata fallback.
  - The preview pane now exposes content text and an image surface that loads image/PDF render artifact bytes.
  - Provider corpus scope now invokes provider behavior checks and writes provider evidence under the preview corpus result path.
  - The corpus wrapper now lets each copied project use scratch-local default bin/obj folders instead of sharing one intermediate-output directory across project references.
  - Corpus tests now drain script stdout and stderr concurrently so solution-level filtered validation cannot hang while corpus subprocesses are still writing redirected output.
  - Thumbnail execution remains assigned to M13; M12 only preserves the R67 thumbnail budget in policy from M11.
