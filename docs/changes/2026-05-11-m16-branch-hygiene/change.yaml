validation:
  - command: pwsh -NoProfile -Command '$vision = Get-Content -Raw VISION.md; $words = ([regex]::Matches($vision, "\b\S+\b")).Count; if ($words -gt 900) { throw "VISION.md exceeds 900 words: $words" }; $required = @("Pitch","What makes this different","Who it is for","Who it is not for","What it commits to","What it refuses to be","What would prove this wrong"); foreach ($heading in $required) { if ($vision -notmatch "## $([regex]::Escape($heading))") { throw "Missing VISION section: $heading" } }'
    result: passed with VISION.md at 283 words
  - command: pwsh -NoProfile -Command '$matches = rg -n "docs/(workflows|roadmap)\\.md" AGENTS.md CONSTITUTION.md docs specs .github README.md CONTRIBUTING.md; if ($LASTEXITCODE -eq 0) { $matches; exit 1 } elseif ($LASTEXITCODE -eq 1) { exit 0 } else { exit $LASTEXITCODE }'
    result: passed with no stale workflow or roadmap references
  - command: git diff --check
    result: passed with line-ending normalization warnings only
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\release-verify.ps1 -SkipPublish
    result: passed
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\release-verify.ps1 -SkipPublish
    result: passed during final verification
  - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci.ps1
    result: passed local broad validation during final verification with 0 build warnings/errors and 342 tests across Core, App, Windows, and Corpus assemblies
notes:
  - M16 was already recorded as implemented, reviewed, and verified in outcome/readiness notes; this change fixes the stale unchecked progress item.
  - V1 verification is now checked after the final verify stage reran on the branch-hygiene state.
