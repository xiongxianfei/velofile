notes:
  - Core resolves Windows drag/drop defaults: same-volume no-modifier move, cross-volume no-modifier copy, Ctrl copy, Shift move, and Ctrl+Shift/Alt shortcut intent.
  - The app shell exposes a drop-action indicator before commit and routes copy/move drops through the existing file operation service and post-mutation listing refresh path.
  - Windows drag/drop data projection is isolated in `VeloFile.Windows` and converts file-drop paths into Core `DropItem` values without exposing OLE details to Core.
  - The compatibility corpus now has automated `dragdrop` and `paths` scopes plus deterministic `dragdrop` and `pathological` profiles.
  - Cross-app drag/drop with Explorer, browser, IDE, and Office remains a manual checklist because those sources are brittle to automate reliably.
  - R81, R82, and I8 file-association Open/Open With behavior remains assigned to M14; M10 covers R79-R80 drag/drop behavior plus path compatibility corpus expansion.
