notes:
  - Core resolves Windows drag/drop defaults: same-volume no-modifier move, cross-volume no-modifier copy, Ctrl copy, Shift move, and Ctrl+Shift/Alt shortcut intent.
  - The app shell exposes a drop-action indicator before commit and routes copy/move/shortcut drops through the existing file operation service and post-mutation listing refresh path.
  - The WinUI file list is wired as the production drop target through a thin event bridge into `AppDragDropRoute`.
  - Shortcut drops create `.lnk` files through the Windows Shell boundary with non-colliding destination names.
  - Windows drag/drop data projection is isolated in `VeloFile.Windows` and converts file-drop paths into Core `DropItem` values without exposing OLE details to Core.
  - Drag/drop extraction and path projection failures are controlled at the app route and Windows adapter boundaries, so malformed external payloads resolve to no-drop instead of escaping the WinUI route.
  - WinUI storage-item projection is all-or-nothing: blank or virtual payload items reject the entire drop instead of being filtered out before commit.
  - The compatibility corpus now has automated `dragdrop` and `paths` scopes plus deterministic `dragdrop` and `pathological` profiles. Path results use per-case verified/skipped/unavailable/failed/not-implemented status, and verified cases require explicit behavior-verifier evidence instead of fixture-only proof.
  - The corpus script helper copies the Core project into the scratch-owned tool source so path behavior verification can use Core listing/search services without repo-side build output.
  - Cross-app drag/drop with Explorer, browser, IDE, and Office remains a manual checklist because those sources are brittle to automate reliably.
  - R81, R82, and I8 file-association Open/Open With behavior remains assigned to M14; M10 covers R79-R80 drag/drop behavior plus path compatibility corpus expansion.
