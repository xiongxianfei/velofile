  summary: Added governed deterministic fixture icon resources, allowlisted file-list icon kinds, resource-backed icon geometry mapping, row-template icon binding, and a tokenized file-list details header while preserving existing selection, context-menu, drag/drop, thumbnail, and preview routes. Accepted full-shell visual evidence for shell-file-list-selected-focused is still pending.
