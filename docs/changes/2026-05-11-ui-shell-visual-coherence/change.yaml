    - dotnet build src\VeloFile.App\VeloFile.App.csproj -c Debug
    - dotnet test VeloFile.sln -c Debug --filter "FileListResourceContractTests|UiFixture|UiContracts"
    - dotnet test VeloFile.sln -c Debug --filter "UiContracts|FileList|AppShellContract|DragDrop|Preview"
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci.ps1
    - git diff --check
