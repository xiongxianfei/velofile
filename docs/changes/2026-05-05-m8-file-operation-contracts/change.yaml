notes:
  - Normal Delete routes through the operation service as Recycle Bin delete.
  - Shift+Delete and unsupported Recycle Bin fallback create a permanent-delete confirmation state before any destructive adapter call.
  - Permanent delete requests sent to the Windows shell adapter must be explicitly confirmed and are never undo-eligible.
  - Rename is a two-step shell route: command starts pending rename and commit supplies the target name to the operation service.
  - The Windows shell-operation adapter maps operation requests to explicit rename, Recycle Bin delete, or permanent delete intents and runs blocking Windows work off the UI call path.
  - Copy/move conflict handling, batch operation continuation, and full undo execution remain assigned to M9.
