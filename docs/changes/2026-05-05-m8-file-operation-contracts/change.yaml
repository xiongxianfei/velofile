notes:
  - Normal Delete routes through the operation service as Recycle Bin delete.
  - The production Windows adapter classifies known unsupported Recycle Bin targets, including UNC paths, as RecycleBinUnavailable before invoking any delete executor.
  - Shift+Delete and unsupported Recycle Bin fallback create a permanent-delete confirmation state before any destructive adapter call.
  - Ambiguous Windows/Shell failures stay recoverable failures and do not offer destructive fallback.
  - Permanent delete requests sent to the Windows shell adapter must be explicitly confirmed and are never undo-eligible.
  - Rename is a complete two-step shell route: command starts visible rename state; Enter/button commit calls the operation service; Escape/button cancel clears pending state without adapter calls.
  - Running operations expose cancellable state when the adapter supports cancellation, and the shell routes Cancel operation to the retained in-flight cancellation token.
  - The Windows shell-operation adapter maps operation requests to explicit rename, Recycle Bin delete, or permanent delete intents and runs blocking Windows work off the UI call path.
  - Copy/move conflict handling, batch operation continuation, and full undo execution remain assigned to M9.
