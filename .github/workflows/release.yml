name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signed release tag
        shell: pwsh
        env:
          VELOFILE_RELEASE_GPG_PUBLIC_KEYS: ${{ secrets.VELOFILE_RELEASE_GPG_PUBLIC_KEYS }}
          VELOFILE_RELEASE_GPG_FINGERPRINTS: ${{ secrets.VELOFILE_RELEASE_GPG_FINGERPRINTS }}
        run: |
          git fetch --force --tags
          ./scripts/verify-release-tag.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/release-verify.ps1 -SkipPublish

      - name: Build signed release package
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Mode SignedRelease -SigningThumbprint "${{ secrets.VELOFILE_SIGNING_THUMBPRINT }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag artifacts/msix/*.msix artifacts/msix/package-metadata.json --verify-tag --generate-notes --latest
