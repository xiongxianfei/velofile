name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import trusted release signing keys
        shell: pwsh
        env:
          VELOFILE_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.VELOFILE_RELEASE_GPG_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VELOFILE_RELEASE_GPG_PUBLIC_KEY)) {
            throw "VELOFILE_RELEASE_GPG_PUBLIC_KEY is required to verify signed release tags."
          }

          $env:VELOFILE_RELEASE_GPG_PUBLIC_KEY | gpg --batch --import

      - name: Verify signed release tag
        shell: pwsh
        run: |
          git fetch --force --tags
          git verify-tag $env:GITHUB_REF_NAME

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/release-verify.ps1 -SkipPublish

      - name: Build signed release package
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Mode SignedRelease -SigningThumbprint "${{ secrets.VELOFILE_SIGNING_THUMBPRINT }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag artifacts/msix/*.msix artifacts/msix/package-metadata.json --verify-tag --generate-notes --latest
