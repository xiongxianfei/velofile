name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run repository CI script
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: Write CI runtime summary
        if: always()
        shell: pwsh
        run: >
          ./scripts/Write-CiRuntimeSummary.ps1
          -LaneName "ci"
          -Trigger "${{ github.event_name }}"
          -SelectedCategory "FullSolution"
          -ReleaseEvidenceStatus "unknown; broad closeout unfiltered"
          -CorpusScriptSmokeStatus "unknown; broad closeout unfiltered"
          -FullCloseoutStatus "run"
