name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-fast-required:
    name: ci-fast-required
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK info
        id: dotnet_info
        run: dotnet --info

      - name: Restore solution
        id: restore
        run: dotnet restore VeloFile.sln

      - name: Build solution
        id: build
        run: dotnet build VeloFile.sln -c Debug --no-restore

      - name: Validate UI token contracts
        id: ui_contracts
        run: dotnet run --project tools\VeloFile.UiContracts -- validate-tokens --contract docs\ui\tokens.v1.json --xaml-root src\VeloFile.App\Resources --scopes docs\ui\ui-contract-scopes.v1.json --scope-root .

      - name: Test Core
        id: test_core
        run: dotnet test tests\VeloFile.Core.Tests\VeloFile.Core.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=VeloFile.Core.Tests.trx" --results-directory artifacts\test-results\core

      - name: Test App
        id: test_app
        run: dotnet test tests\VeloFile.App.Tests\VeloFile.App.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=VeloFile.App.Tests.trx" --results-directory artifacts\test-results\app

      - name: Test Windows
        id: test_windows
        run: dotnet test tests\VeloFile.Windows.Tests\VeloFile.Windows.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=VeloFile.Windows.Tests.trx" --results-directory artifacts\test-results\windows

      - name: Test Corpus fast and contract
        id: test_corpus_fast_contract
        run: dotnet test tests\VeloFile.Corpus.Tests\VeloFile.Corpus.Tests.csproj -c Debug --no-build --filter "TestCategory=Fast|TestCategory=Contract" --logger "trx;LogFileName=VeloFile.Corpus.FastContract.trx" --results-directory artifacts\test-results\corpus-fast-contract

      - name: Test Corpus script smoke
        id: test_corpus_script_smoke
        run: dotnet test tests\VeloFile.Corpus.Tests\VeloFile.Corpus.Tests.csproj -c Debug --no-build --filter "TestCategory=CorpusScript&TestCategory=Smoke" --logger "trx;LogFileName=VeloFile.Corpus.ScriptSmoke.trx" --results-directory artifacts\test-results\corpus-script-smoke

      - name: Write fast PR runtime summary
        if: always()
        run: |
          $summaryArgs = @(
            "-LaneName", "ci-fast-required",
            "-Trigger", "${{ github.event_name }}",
            "-SelectedCategory", "Fast|Contract;CorpusScript&Smoke",
            "-ReleaseEvidenceStatus", "not run in this lane",
            "-CorpusScriptSmokeStatus", "run",
            "-FullCloseoutStatus", "not run"
          )

          $trxPaths = @(Get-ChildItem -Path artifacts\test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($trxPaths.Count -gt 0) {
            $summaryArgs += @("-TrxPath", $trxPaths)
          }

          $validationSteps = @(
            @{ Outcome = "${{ steps.dotnet_info.outcome }}"; Command = "dotnet --info" },
            @{ Outcome = "${{ steps.restore.outcome }}"; Command = "dotnet restore VeloFile.sln" },
            @{ Outcome = "${{ steps.build.outcome }}"; Command = "dotnet build VeloFile.sln -c Debug --no-restore" },
            @{ Outcome = "${{ steps.ui_contracts.outcome }}"; Command = "dotnet run --project tools\VeloFile.UiContracts -- validate-tokens" },
            @{ Outcome = "${{ steps.test_core.outcome }}"; Command = "dotnet test tests\VeloFile.Core.Tests\VeloFile.Core.Tests.csproj -c Debug --no-build" },
            @{ Outcome = "${{ steps.test_app.outcome }}"; Command = "dotnet test tests\VeloFile.App.Tests\VeloFile.App.Tests.csproj -c Debug --no-build" },
            @{ Outcome = "${{ steps.test_windows.outcome }}"; Command = "dotnet test tests\VeloFile.Windows.Tests\VeloFile.Windows.Tests.csproj -c Debug --no-build" },
            @{ Outcome = "${{ steps.test_corpus_fast_contract.outcome }}"; Command = "dotnet test tests\VeloFile.Corpus.Tests\VeloFile.Corpus.Tests.csproj -c Debug --no-build --filter TestCategory=Fast|TestCategory=Contract" },
            @{ Outcome = "${{ steps.test_corpus_script_smoke.outcome }}"; Command = "dotnet test tests\VeloFile.Corpus.Tests\VeloFile.Corpus.Tests.csproj -c Debug --no-build --filter TestCategory=CorpusScript&TestCategory=Smoke" }
          )

          $failedStep = $validationSteps | Where-Object { $_.Outcome -and $_.Outcome -notin @("success", "skipped") } | Select-Object -First 1
          if ($failedStep) {
            $summaryArgs += @(
              "-FailedCommand", $failedStep.Command,
              "-FailedOutcome", $failedStep.Outcome
            )
          }

          ./scripts/Write-CiRuntimeSummary.ps1 @summaryArgs

      - name: Upload fast PR test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-required-trx
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore

  ci:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run repository CI script
        id: repository_ci
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: Write CI runtime summary
        if: always()
        shell: pwsh
        run: |
          $summaryArgs = @(
            "-LaneName", "ci",
            "-Trigger", "${{ github.event_name }}",
            "-SelectedCategory", "FullSolution",
            "-ReleaseEvidenceStatus", "unknown; broad closeout unfiltered",
            "-CorpusScriptSmokeStatus", "unknown; broad closeout unfiltered",
            "-FullCloseoutStatus", "run"
          )

          $repositoryCiOutcome = "${{ steps.repository_ci.outcome }}"
          if ($repositoryCiOutcome -ne "success") {
            $summaryArgs += @(
              "-FailedCommand", "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci.ps1",
              "-FailedOutcome", $repositoryCiOutcome
            )
          }

          ./scripts/Write-CiRuntimeSummary.ps1 @summaryArgs
